<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>重生·圆明园 | 万园之园 · 数字长卷</title>
<style>
/* ================= 宋式美学 UI · 素笺 · 细金线 · 朱印 ================= */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#2c3036; --paper:rgba(249,245,236,.92); --paper2:rgba(243,238,227,.94);
  --gold:#a9895a; --gold-l:#c9ab72; --seal:#9e3a2f; --seal-d:#7e2c23;
  --text:#3d4148; --muted:#8a8072; --line:rgba(169,137,90,.5);
}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:'Songti SC','STSong','STZhongsong','Noto Serif CJK SC','SimSun',serif;background:#101418;color:var(--text);-webkit-font-smoothing:antialiased}
canvas{display:block}
/* 画质升级:轻暗角 overlay(径向渐变,pointer-events:none 不挡交互) */
#vignette{position:fixed;inset:0;pointer-events:none;z-index:50;background:radial-gradient(ellipse 125% 95% at 50% 42%, rgba(10,14,22,0) 55%, rgba(10,14,22,.15) 80%, rgba(6,9,15,.32) 100%)}
#ui{position:fixed;inset:0;pointer-events:none;z-index:100}
#ui>*{pointer-events:auto}

/* ---------- 左上 · 数据面板 ---------- */
.stats{position:absolute;top:16px;left:16px;width:212px;padding:14px 16px 12px;
  background:linear-gradient(165deg,var(--paper),var(--paper2));
  border:1px solid var(--line);box-shadow:0 3px 22px rgba(30,25,15,.22), inset 0 0 0 1px rgba(255,255,255,.55);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .35s ease,opacity .35s ease}
.stats::before{content:'';position:absolute;inset:3px;border:1px solid rgba(169,137,90,.28);pointer-events:none}
.stats-title{display:flex;align-items:center;gap:8px}
.seal-mini{width:26px;height:26px;background:var(--seal);color:#f6efe2;font-size:15px;line-height:26px;text-align:center;flex:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.28), 0 1px 3px rgba(120,30,20,.4);font-weight:700}
.stats h1{font-size:16.5px;letter-spacing:3px;color:var(--ink);font-weight:700;white-space:nowrap}
.stats .sub{font-size:9.5px;letter-spacing:3.5px;color:var(--muted);margin:6px 0 10px;text-align:center}
.stats .rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold-l) 18%,var(--gold-l) 82%,transparent);margin:0 0 10px;position:relative}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 6px}
.stat{text-align:center}
.stat b{display:block;font-size:16px;font-weight:700;color:var(--ink);letter-spacing:.5px;font-family:'Songti SC','STSong','SimSun',serif}
.stat i{display:block;font-style:normal;font-size:9px;color:var(--muted);letter-spacing:2px;margin-top:2px}
.stats .meta{margin-top:10px;padding-top:8px;border-top:1px solid rgba(169,137,90,.25);font-size:9.5px;color:var(--muted);letter-spacing:1px;text-align:center;font-variant-numeric:tabular-nums}

/* ---------- 右上 · 详情卡 ---------- */
.detail{position:absolute;top:16px;right:16px;width:296px;max-height:calc(100vh - 120px);overflow-y:auto;padding:16px 18px 15px;
  background:linear-gradient(165deg,var(--paper),var(--paper2));
  border:1px solid var(--line);box-shadow:0 3px 22px rgba(30,25,15,.22), inset 0 0 0 1px rgba(255,255,255,.55);
  opacity:0;transform:translateX(14px);pointer-events:none;transition:opacity .4s ease,transform .4s ease;scrollbar-width:thin}
.detail::before{content:'';position:absolute;inset:3px;border:1px solid rgba(169,137,90,.28);pointer-events:none}
.detail.show{opacity:1;transform:none;pointer-events:auto}
.detail .close{position:absolute;top:8px;right:8px;width:24px;height:24px;border:1px solid rgba(169,137,90,.4);background:rgba(255,255,255,.4);color:var(--muted);cursor:pointer;font-size:12px;line-height:22px;text-align:center;transition:.2s}
.detail .close:hover{background:var(--seal);color:#f6efe2;border-color:var(--seal)}
.d-name{font-size:21px;color:var(--ink);letter-spacing:5px;font-weight:700;display:inline-block}
.d-name::after{content:'';display:block;width:34px;height:2px;background:var(--seal);margin-top:7px}
.d-year{font-size:10px;color:var(--muted);letter-spacing:2px;margin:9px 0 10px}
.d-poem{writing-mode:vertical-rl;-webkit-writing-mode:vertical-rl;height:158px;max-width:100%;overflow:hidden;
  font-size:13.5px;line-height:2.15;letter-spacing:5px;color:#54463a;padding:6px 0 0 4px;
  background:linear-gradient(90deg,rgba(169,137,90,.12),rgba(169,137,90,.03) 40%);
  border-left:1px solid rgba(169,137,90,.35);margin:0 0 11px;white-space:nowrap}
.d-desc{font-size:12px;line-height:1.95;color:var(--text);text-align:justify;letter-spacing:.4px}
.d-tags{margin-top:11px;display:flex;flex-wrap:wrap;gap:5px}
.d-tag{font-size:10px;padding:3px 9px;border:1px solid rgba(169,137,90,.45);color:#7a6a4e;letter-spacing:1.5px;background:rgba(255,252,244,.5)}

/* ---------- 底部 · 景区导航 ---------- */
.nav{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:flex-end;gap:9px;
  padding:10px 16px 9px;background:linear-gradient(165deg,var(--paper),var(--paper2));
  border:1px solid var(--line);box-shadow:0 3px 22px rgba(30,25,15,.25), inset 0 0 0 1px rgba(255,255,255,.55);transition:transform .3s ease}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:none;cursor:pointer;padding:2px 3px;transition:transform .22s ease;font-family:inherit}
.nav-btn:hover{transform:translateY(-3px)}
.nav-btn .glyph{width:32px;height:32px;border:1px solid rgba(158,58,47,.65);color:var(--seal);font-size:16px;line-height:30px;text-align:center;font-weight:700;background:rgba(255,255,255,.45);transition:.22s ease;position:relative}
.nav-btn .glyph::after{content:'';position:absolute;inset:2px;border:1px solid rgba(158,58,47,.18)}
.nav-btn span{font-size:11px;letter-spacing:2px;color:var(--text);white-space:nowrap}
.nav-btn.active .glyph{background:var(--seal);color:#f6efe2;box-shadow:0 2px 10px rgba(158,58,47,.45)}
.nav-btn.active .glyph::after{border-color:rgba(246,239,226,.4)}
.nav-btn.active span{color:var(--seal);font-weight:700}
.nav-sep{width:1px;height:38px;background:linear-gradient(180deg,transparent,var(--line),transparent);align-self:center;margin:0 3px}

/* ---------- 操作提示 ---------- */
.hint{position:absolute;bottom:20px;right:18px;font-size:10px;letter-spacing:2px;color:rgba(240,235,220,.85);
  background:rgba(24,26,30,.42);padding:6px 12px;border:1px solid rgba(201,171,114,.35);backdrop-filter:blur(4px)}

/* ---------- 加载页 · 素笺 + 朱印 ---------- */
#loading{position:fixed;inset:0;z-index:1000;background:linear-gradient(180deg,#efe9db,#e7e0cf);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .9s ease,visibility .9s}
#loading.hide{opacity:0;visibility:hidden;pointer-events:none}
.load-frame{position:relative;padding:38px 46px;border:1px solid rgba(169,137,90,.5);box-shadow:inset 0 0 0 1px rgba(169,137,90,.25),0 4px 40px rgba(80,60,30,.12);background:rgba(255,252,244,.4)}
.load-seal{writing-mode:vertical-rl;font-size:31px;letter-spacing:13px;color:var(--seal);font-weight:700;padding:16px 9px;border:2px solid var(--seal);box-shadow:inset 0 0 0 1px rgba(158,58,47,.22);opacity:0;transform:scale(1.25);animation:stampIn .7s cubic-bezier(.2,1.4,.4,1) .15s forwards}
@keyframes stampIn{from{opacity:0;transform:scale(1.3) rotate(-4deg)}to{opacity:.92;transform:scale(1) rotate(0)}}
.load-caption{margin-top:24px;font-size:12px;letter-spacing:7px;color:var(--muted);opacity:0;animation:fadeIn .8s ease .6s forwards}
.load-bar{margin-top:16px;width:230px;height:2px;background:rgba(169,137,90,.22)}
.load-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a6a3c,var(--gold-l));transition:width .3s ease}
.load-foot{position:absolute;bottom:26px;font-size:10px;letter-spacing:4px;color:rgba(138,128,114,.75);opacity:0;animation:fadeIn 1s ease 1s forwards}
@keyframes fadeIn{to{opacity:1}}

/* ---------- 移动端 ---------- */
@media (max-width:640px){
  .stats{width:170px;padding:10px 12px 9px;transform:scale(.92);transform-origin:top left}
  .stats h1{font-size:14px}
  .detail{width:calc(100vw - 24px);right:12px;top:12px;max-height:44vh}
  .d-poem{height:110px;font-size:12px}
  .nav{bottom:10px;gap:5px;padding:7px 9px 6px;max-width:calc(100vw - 12px);overflow-x:auto}
  .nav-btn .glyph{width:26px;height:26px;font-size:13px;line-height:24px}
  .nav-btn span{font-size:9.5px;letter-spacing:1px}
  .nav-sep{height:26px}
  .hint{display:none}
}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:rgba(169,137,90,.4)}
</style>
</head>

<script>
/* ============ OrbitControls(自 v3 内联版复制,增补触控支持;未改动 v3 任何文件) ============ */
THREE.OrbitControls = function(camera, domElement) {
  this.camera = camera;
  this.domElement = domElement;
  this.target = new THREE.Vector3();
  this.enableDamping = false;
  this.dampingFactor = 0.05;
  this.minDistance = 0;
  this.maxDistance = Infinity;
  this.maxPolarAngle = Math.PI;
  this.minPolarAngle = 0;

  var spherical = new THREE.Spherical();
  var sphericalDelta = new THREE.Spherical();
  var scale = 1;
  var panOffset = new THREE.Vector3();
  var rotateStart = new THREE.Vector2();
  var rotateEnd = new THREE.Vector2();
  var rotateDelta = new THREE.Vector2();
  var panStart = new THREE.Vector2();
  var panEnd = new THREE.Vector2();
  var panDelta = new THREE.Vector2();
  var state = -1; // -1=none 0=rotate 2=pan
  var EPS = 0.000001;
  var scope = this;

  function getZoomScale() { return Math.pow(0.95, 1); }
  function rotateLeft(angle) { sphericalDelta.theta -= angle; }
  function rotateUp(angle) { sphericalDelta.phi -= angle; }

  var panLeft = function() {
    var v = new THREE.Vector3();
    return function(distance, objectMatrix) {
      v.setFromMatrixColumn(objectMatrix, 0);
      v.multiplyScalar(-distance);
      panOffset.add(v);
    };
  }();
  var panUp = function() {
    var v = new THREE.Vector3();
    return function(distance, objectMatrix) {
      v.setFromMatrixColumn(objectMatrix, 1);
      v.multiplyScalar(distance);
      panOffset.add(v);
    };
  }();
  var pan = function() {
    var offset = new THREE.Vector3();
    return function(deltaX, deltaY) {
      var element = scope.domElement;
      var position = scope.camera.position;
      offset.copy(position).sub(scope.target);
      var targetDistance = offset.length();
      targetDistance *= Math.tan((scope.camera.fov/2) * Math.PI/180.0);
      panLeft(2 * deltaX * targetDistance / element.clientHeight, scope.camera.matrix);
      panUp(2 * deltaY * targetDistance / element.clientHeight, scope.camera.matrix);
    };
  }();

  function handleMouseDownRotate(event) { rotateStart.set(event.clientX, event.clientY); }
  function handleMouseDownPan(event) { panStart.set(event.clientX, event.clientY); }
  function handleMouseMoveRotate(event) {
    rotateEnd.set(event.clientX, event.clientY);
    rotateDelta.subVectors(rotateEnd, rotateStart).multiplyScalar(1);
    rotateLeft(2 * Math.PI * rotateDelta.x / domElement.clientHeight);
    rotateUp(2 * Math.PI * rotateDelta.y / domElement.clientHeight);
    rotateStart.copy(rotateEnd);
    scope.update();
  }
  function handleMouseMovePan(event) {
    panEnd.set(event.clientX, event.clientY);
    panDelta.subVectors(panEnd, panStart).multiplyScalar(1);
    pan(panDelta.x, panDelta.y);
    panStart.copy(panEnd);
    scope.update();
  }
  function handleMouseWheel(event) {
    if (event.deltaY < 0) { scale /= getZoomScale(); }
    else if (event.deltaY > 0) { scale *= getZoomScale(); }
    scope.update();
  }
  function onMouseDown(event) {
    event.preventDefault();
    switch(event.button) {
      case 0: state = 0; handleMouseDownRotate(event); break;
      case 2: state = 2; handleMouseDownPan(event); break;
    }
    if (state !== -1) {
      document.addEventListener('mousemove', onMouseMove, false);
      document.addEventListener('mouseup', onMouseUp, false);
    }
  }
  function onMouseMove(event) {
    event.preventDefault();
    switch(state) { case 0: handleMouseMoveRotate(event); break; case 2: handleMouseMovePan(event); break; }
  }
  function onMouseUp() {
    state = -1;
    document.removeEventListener('mousemove', onMouseMove, false);
    document.removeEventListener('mouseup', onMouseUp, false);
  }
  function onMouseWheel(event) {
    event.preventDefault();
    event.stopPropagation();
    handleMouseWheel(event);
  }
  function onContextMenu(event) { event.preventDefault(); }

  /* 触控(v3 缺失,此处增补):单指旋转 / 双指捏合缩放+平移 */
  var touchStartDist = 0, touchMode = -1;
  function onTouchStart(event) {
    switch(event.touches.length) {
      case 1:
        touchMode = 0; rotateStart.set(event.touches[0].pageX, event.touches[0].pageY); break;
      case 2:
        touchMode = 1;
        var dx = event.touches[0].pageX - event.touches[1].pageX;
        var dy = event.touches[0].pageY - event.touches[1].pageY;
        touchStartDist = Math.sqrt(dx*dx + dy*dy);
        panStart.set((event.touches[0].pageX + event.touches[1].pageX)/2, (event.touches[0].pageY + event.touches[1].pageY)/2);
        break;
    }
    event.preventDefault();
  }
  function onTouchMove(event) {
    event.preventDefault(); event.stopPropagation();
    switch(event.touches.length) {
      case 1:
        if (touchMode !== 0) return;
        rotateEnd.set(event.touches[0].pageX, event.touches[0].pageY);
        rotateDelta.subVectors(rotateEnd, rotateStart);
        rotateLeft(2 * Math.PI * rotateDelta.x / domElement.clientHeight);
        rotateUp(2 * Math.PI * rotateDelta.y / domElement.clientHeight);
        rotateStart.copy(rotateEnd);
        scope.update();
        break;
      case 2:
        if (touchMode !== 1) return;
        var dx = event.touches[0].pageX - event.touches[1].pageX;
        var dy = event.touches[0].pageY - event.touches[1].pageY;
        var dist = Math.sqrt(dx*dx + dy*dy);
        if (touchStartDist > 0) { scale *= touchStartDist / dist; }
        touchStartDist = dist;
        panEnd.set((event.touches[0].pageX + event.touches[1].pageX)/2, (event.touches[0].pageY + event.touches[1].pageY)/2);
        panDelta.subVectors(panEnd, panStart);
        pan(panDelta.x, panDelta.y);
        panStart.copy(panEnd);
        scope.update();
        break;
    }
  }
  function onTouchEnd(event) { touchMode = -1; touchStartDist = 0; if (event.touches.length === 0) event.preventDefault(); }

  this.update = function() {
    var offset = new THREE.Vector3();
    var quat = new THREE.Quaternion().setFromUnitVectors(camera.up, new THREE.Vector3(0, 1, 0));
    var quatInverse = quat.clone().invert();
    var lastPosition = new THREE.Vector3();
    var lastQuaternion = new THREE.Quaternion();
    return function() {
      var position = scope.camera.position;
      offset.copy(position).sub(scope.target);
      offset.applyQuaternion(quat);
      spherical.setFromVector3(offset);
      spherical.theta += sphericalDelta.theta;
      spherical.phi += sphericalDelta.phi;
      spherical.phi = Math.max(scope.minPolarAngle, Math.min(scope.maxPolarAngle, spherical.phi));
      spherical.radius *= scale;
      spherical.radius = Math.max(scope.minDistance, Math.min(scope.maxDistance, spherical.radius));
      scope.target.add(panOffset);
      offset.setFromSpherical(spherical);
      offset.applyQuaternion(quatInverse);
      position.copy(scope.target).add(offset);
      scope.camera.lookAt(scope.target);
      if (scope.enableDamping) {
        sphericalDelta.theta *= (1 - scope.dampingFactor);
        sphericalDelta.phi *= (1 - scope.dampingFactor);
        panOffset.multiplyScalar(1 - scope.dampingFactor);
      } else {
        sphericalDelta.set(0, 0, 0);
        panOffset.set(0, 0, 0);
      }
      scale = 1;
      if (lastPosition.distanceToSquared(scope.camera.position) > EPS ||
        8 * (1 - lastQuaternion.dot(scope.camera.quaternion)) > EPS) {
        lastPosition.copy(scope.camera.position);
        lastQuaternion.copy(scope.camera.quaternion);
        return true;
      }
      return false;
    };
  }();
  this.dispose = function() {
    domElement.removeEventListener('contextmenu', onContextMenu, false);
    domElement.removeEventListener('mousedown', onMouseDown, false);
    domElement.removeEventListener('wheel', onMouseWheel, false);
    domElement.removeEventListener('touchstart', onTouchStart, false);
    domElement.removeEventListener('touchmove', onTouchMove, false);
    domElement.removeEventListener('touchend', onTouchEnd, false);
  };
  domElement.addEventListener('contextmenu', onContextMenu, false);
  domElement.addEventListener('mousedown', onMouseDown, false);
  domElement.addEventListener('wheel', onMouseWheel, {passive: false});
  domElement.addEventListener('touchstart', onTouchStart, {passive: false});
  domElement.addEventListener('touchmove', onTouchMove, {passive: false});
  domElement.addEventListener('touchend', onTouchEnd, {passive: false});
};
</script>
<script>
/* ============================================================
   重生·圆明园 v4 —— 依《四十景图咏》重筑
   汉白玉基调 · 朱红柱墙 · 青绿/灰瓦屋顶 · 金色仅点缀屋脊宝顶

var SCENES = {
  overview:{cam:[14,118,232],look:[0,2,8],title:'圆明三园 · 全景',year:'1707—1860',
    poem:'谁道江南风景佳,移天缩地在君怀。',
    desc:'圆明园由圆明、长春、绮春三园组成,占地约350公顷。东北为仿海上仙山的方壶胜境,东方为西洋楼大水法,西方为正大光明正殿,中央后湖九岛环列,是谓九州清晏。',

/* ==================== 小工具 ==================== */
function rnd(seed){ var s=seed; return function(){ s=(s*9301+49297)%233280; return s/233280; }; }
function deg(v){ return v*Math.PI/180; }
function lerp(a,b,t){ return a+(b-a)*t; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

/* 合并 BufferGeometry(全部转 non-indexed 后拼接 position/normal/uv) */
function mergeGeoms(list){
  var total=0, geoms=[];
  for(var i=0;i<list.length;i++){ var g=list[i]; if(g.index) g=g.toNonIndexed(); geoms.push(g); total+=g.attributes.position.count; }
  var pos=new Float32Array(total*3), nor=new Float32Array(total*3), uv=new Float32Array(total*2);
  var o=0;
  for(i=0;i<geoms.length;i++){
    var g=geoms[i];
    pos.set(g.attributes.position.array, o*3);
    if(g.attributes.normal) nor.set(g.attributes.normal.array, o*3);
    if(g.attributes.uv) uv.set(g.attributes.uv.array, o*2);
    o+=g.attributes.position.count;
  }
  var out=new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos,3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor,3));
  out.setAttribute('uv', new THREE.BufferAttribute(uv,2));
  return out;
}
/* 变换复制:返回应用了平移/旋转/缩放的克隆几何 */
function tgeo(geo, x,y,z, rx,ry,rz, sx,sy,sz){
  var g=geo.clone();
  var m=new THREE.Matrix4();
  var q=new THREE.Quaternion().setFromEuler(new THREE.Euler(rx||0, ry||0, rz||0));
  m.compose(new THREE.Vector3(x||0,y||0,z||0), q, new THREE.Vector3(sx||1,sy||1,sz||1));
  g.applyMatrix4(m);
  return g;
}

/* ==================== 程序化纹理(canvas 生成,零外部资源) ==================== */
function makeTex(w,h,fn,repX,repY){
  var c=document.createElement('canvas'); c.width=w; c.height=h;
  fn(c.getContext('2d'), w, h);
  var t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  if(repX) t.repeat.set(repX, repY||repX);
  t.encoding=THREE.sRGBEncoding;
  t.anisotropy=4;
  return t;
}
function speckle(g,w,h,n,c1,c2,rmin,rmax,seedFn){
  for(var i=0;i<n;i++){
    var r=seedFn();
    g.fillStyle = (r<0.5? c1:c2);
    g.globalAlpha = 0.05+r*0.08;
    var rr = rmin + seedFn()*(rmax-rmin);
    g.beginPath(); g.arc(seedFn()*w, seedFn()*h, rr, 0, 6.283); g.fill();
  }
  g.globalAlpha=1;
}

/* 画质升级:数据纹理(法线/粗糙度图,保持线性编码,不套 sRGB) */
function makeTexN(w,h,fn,repX,repY){
  var c=document.createElement('canvas'); c.width=w; c.height=h;
  fn(c.getContext('2d'), w, h);
  var t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  if(repX) t.repeat.set(repX, repY||repX);
  t.anisotropy=4;
  return t;
}
/* 画质升级:由灰度高图烘焙法线贴图(Sobel 梯度→RGB 编码,OpenGL 约定) */
function heightToNormal(srcCanvas, strength){
  var w=srcCanvas.width, h=srcCanvas.height;
  var sg=srcCanvas.getContext('2d').getImageData(0,0,w,h).data;
  var out=document.createElement('canvas'); out.width=w; out.height=h;
  var og=out.getContext('2d');
  var od=og.createImageData(w,h);
  function hgt(x,y){
    x=((x%w)+w)%w; y=((y%h)+h)%h;
    var i=(y*w+x)*4;
    return (sg[i]+sg[i+1]+sg[i+2])/765;
  }
  for(var y=0;y<h;y++){
    for(var x=0;x<w;x++){
      var dx=(hgt(x-1,y)-hgt(x+1,y))*strength;
      var dy=(hgt(x,y+1)-hgt(x,y-1))*strength;
      var len=Math.sqrt(dx*dx+dy*dy+1);
      var i=(y*w+x)*4;
      od.data[i]=(dx/len*0.5+0.5)*255;
      od.data[i+1]=(dy/len*0.5+0.5)*255;
      od.data[i+2]=(1/len*0.5+0.5)*255;
      od.data[i+3]=255;
    }
  }
  og.putImageData(od,0,0);
  return out;
}

/* ==================== 屋面几何生成(庑殿/攒尖 + 飞檐翘角) ==================== */
/* 庑殿顶:w×d 底面,h 高,ridge 正脊长度比例(0~0.8),curl 翘角幅度 */
function hipRoofGeo(w, d, h, ridge, curl){
  var pos=[], uvs=[], idx=[];
  var w2=w/2, d2=d/2, rl=Math.max(0.8, w*clamp(ridge,0.05,0.9)/2);
  var nu=10, nt=6;
  function curve(t){ return h*Math.pow(t,1.6) + h*0.10*Math.sin(t*Math.PI); }
  function lift(u,t){ /* 角部起翘:|u|大且靠近檐口时抬升 */
    var c=clamp((Math.abs(u)-0.45)/0.55, 0, 1);
    return (curl||h*0.22)*c*c*Math.pow(1-t,1.6);
  }
  function push(x,y,z,u,v){ pos.push(x,y,z); uvs.push(u,v); }
  function grid(iu,it){ /* 前坡(单张网格,延伸为四坡共用参数) */
    var u=-1+2*iu/nu, t=it/nt;
    return { u:u, t:t };
  }
  /* 前后坡:u 沿横向(world/8.3m 一重复,约0.52m一道瓦垄),v 沿坡 0..1 */
  for(var s=0;s<2;s++){
    var sz = (s===0)? 1 : -1;
    var base=pos.length/3;
    for(var iu=0; iu<=nu; iu++){
      for(var it=0; it<=nt; it++){
        var g=grid(iu,it), t=g.t;
        var x=g.u*(w2*(1-t)+rl*t);
        var z=sz*d2*(1-t);
        var y=curve(t)+lift(g.u,t);
        push(x,y,z, x*0.12, t);
      }
    }
    for(iu=0; iu<nu; iu++){
      for(var it2=0; it2<nt; it2++){
        var a=base+iu*(nt+1)+it2, b=a+nt+1;
        if(s===0) idx.push(a,b,a+1, b,b+1,a+1);
        else idx.push(a,a+1,b, b,a+1,b+1);
      }
    }
  }
  /* 左右坡(三角面收于脊端) */
  for(s=0;s<2;s++){
    var sx=(s===0)?1:-1;
    var ns=6, base2=pos.length/3;
    for(var is=0; is<=ns; is++){
      var v=-1+2*is/ns;
      for(var it3=0; it3<=nt; it3++){
        var t2=it3/nt;
        var x2=sx*(w2*(1-t2)+rl*t2);
        var z2=v*d2*(1-t2);
        var y2=curve(t2)+lift(v*0.92,t2);
        push(x2,y2,z2, z2*0.12, t2);
      }
    }
    for(is=0; is<ns; is++){
      for(it3=0; it3<nt; it3++){
        var a2=base2+is*(nt+1)+it3, b2=a2+(nt+1);
        idx.push(a2,b2,a2+1, b2,b2+1,a2+1);
      }
    }
  }
  var geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs,2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return geo;
}
/* 攒尖顶(n 边形,顶点收束) */
function pyramidRoofGeo(r, h, n, curl){
  var pos=[], uvs=[], idx=[];
  var nt=5, per=2*Math.PI*r;
  function curve(t){ return h*Math.pow(t,1.5)+h*0.08*Math.sin(t*Math.PI); }
  function liftCorner(t){ /* 檐角起翘 */
    if(t>0.66) return 0;
    return (curl||h*0.2)*Math.pow(1-t/0.66,1.5)*0.55;
  }
  for(var e=0;e<n;e++){
    var a0=e/n*Math.PI*2, a1=(e+1)/n*Math.PI*2;
    var base=pos.length/3;
    for(var it=0;it<=nt;it++){
      var t=it/nt;
      var rr=r*(1-t);
      var shrink=1-t*0.12; /* 顶面略内收 */
      var lift=liftCorner(t);
      var p0=[Math.cos(a0)*rr*shrink, curve(t)+lift, Math.sin(a0)*rr*shrink];
      var p1=[Math.cos(a1)*rr*shrink, curve(t)+lift, Math.sin(a1)*rr*shrink];
      pos.push(p0[0],p0[1],p0[2], p1[0],p1[1],p1[2]);
      uvs.push((per*e/n+rr*0.6)*0.12, t, (per*(e+1)/n+rr*0.6)*0.12, t);
    }
    for(var it2=0;it2<nt;it2++){
      var a=base+it2*2, b=a+2;
      idx.push(a,a+1,b, b,a+1,b+1);
    }
  }
  var geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs,2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return geo;
}

<script>
/* ==================== 建筑构件 ==================== */
var boxG = new THREE.BoxGeometry(1,1,1);
var cylG = new THREE.CylinderGeometry(1,1,1,10);

var coneG = new THREE.ConeGeometry(1,1,10);

/* 汉白玉栏杆(望柱+寻杖+栏板):len 长度,沿局部 X 轴,中心对齐 */
function balustradeGeo(len, h){
  h = h||0.92;
  var parts=[];
  var nPost = Math.max(2, Math.round(len/1.7)+1);
  var step = len/(nPost-1);
  var postG = mergeGeoms([
    tgeo(boxG, 0, h*0.42, 0, 0,0,0, 0.2, h*0.84, 0.2),
    tgeo(boxG, 0, h*0.92, 0, 0,0,0, 0.3, 0.16, 0.3),
    tgeo(boxG, 0, h*0.99, 0, 0,0,0, 0.16, 0.06, 0.16)
  ]);
  for(var i=0;i<nPost;i++){
    parts.push(tgeo(postG, -len/2+i*step, 0, 0));
  }
  var railY=[h*0.78, h*0.5, h*0.16];
  for(i=0;i<3;i++){
    parts.push(tgeo(boxG, 0, railY[i], 0, 0,0,0, len, i===2?0.1:0.07, 0.09));
  }
  var nPanel=nPost-1;
  for(i=0;i<nPanel;i++){
    parts.push(tgeo(boxG, -len/2+step*(i+0.5), h*0.44, 0, 0,0,0, step-0.24, 0.3, 0.06));
  }
  return mergeGeoms(parts);
}

/* 须弥座台基:多层线脚,tiers 数,顶面到达 y=topY(局部) */
function podiumGeo(w, d, tiers, tierH){
  var parts=[];
  var tw=w, td=d;
  for(var i=0;i<tiers;i++){
    var shrink=i*0.9;
    parts.push(tgeo(boxG, 0, tierH*i+tierH/2, 0, 0,0,0, tw-shrink, tierH, td-shrink));
    parts.push(tgeo(boxG, 0, tierH*i+tierH-0.06, 0, 0,0,0, tw-shrink+0.18, 0.12, td-shrink+0.18));
  }
  return mergeGeoms(parts);
}

/* 门/窗棂格平面 */
function latticeGeo(w, h){
  return tgeo(new THREE.PlaneGeometry(w,h), 0,0,0);
}

/* 单层殿堂:opts {bays,bayW,depth,colH,roofTex,roofH,ridge,plat:{w,d,h,tiers}|skip,baseY,gold} */
function buildHall(opts){
  var g=new THREE.Group();
  var bays=opts.bays||5, bayW=opts.bayW||3.2;
  var w=bays*bayW, d=opts.depth||(bays*1.65);
  var colH=opts.colH||4.6;
  var plat=opts.plat||{w:w+7,d:d+6,h:0.75,tiers:2};
  var platY=(opts.baseY!==undefined)? opts.baseY : plat.tiers*(plat.h||0.75);
  /* 台基 */
  if(!opts.platSkip){
    var pod=new THREE.Mesh(podiumGeo(plat.w, plat.d, plat.tiers, plat.h||0.75), MAT.marble);
    pod.position.y=(plat.h||0.75)*plat.tiers/2; pod.castShadow=pod.receiveShadow=true; g.add(pod);
    /* 台基栏杆 */
    var rail=new THREE.Mesh(balustradeGeo(plat.w-1.2), MAT.marble); rail.position.set(0,platY, plat.d/2-0.75); rail.castShadow=true; g.add(rail);
    var rail2=rail.clone(); rail2.position.z=-(plat.d/2-0.75); g.add(rail2);
    var rail3=new THREE.Mesh(balustradeGeo(plat.d-1.2), MAT.marble); rail3.rotation.y=Math.PI/2; rail3.position.set(plat.w/2-0.75,platY,0); rail3.castShadow=true; g.add(rail3);
    var rail4=rail3.clone(); rail4.position.x=-(plat.w/2-0.75); g.add(rail4);
  }
  /* 柱(朱红,金箍) */
  var colParts=[], colGeo=new THREE.CylinderGeometry(0.24,0.28,colH,9);
  for(var i=0;i<bays;i++){
    var x=-w/2+bayW*(i+0.5);
    colParts.push(tgeo(colGeo, x, platY+colH/2, d/2-0.5));
    colParts.push(tgeo(colGeo, x, platY+colH/2, -d/2+0.5));
  }
  for(i=1;i<2;i++){
    var zc=-d/2+0.5+ (d-1)*(i/2);
    colParts.push(tgeo(colGeo, -w/2+0.5, platY+colH/2, zc));
    colParts.push(tgeo(colGeo,  w/2-0.5, platY+colH/2, zc));
  }
  var cols=new THREE.Mesh(mergeGeoms(colParts), MAT.column);
  cols.castShadow=true; g.add(cols);
  /* 檐下斗拱带 */
  var bandY=platY+colH;
  var band=new THREE.Mesh(mergeGeoms([
    tgeo(boxG, 0, bandY+0.16, d/2+0.28, 0,0,0, w+1.6, 0.5, 0.5),
    tgeo(boxG, 0, bandY+0.16, -d/2-0.28, 0,0,0, w+1.6, 0.5, 0.5),
    tgeo(boxG, w/2+0.28, bandY+0.16, 0, 0,0,0, 0.5, 0.5, d+0.5),
    tgeo(boxG, -w/2-0.28, bandY+0.16, 0, 0,0,0, 0.5, 0.5, d+0.5)
  ]), MAT.dougong);
  band.castShadow=true; g.add(band);
  /* 墙(红墙,次间)—— 檐墙在前后柱列后侧 */
  var wallParts=[];
  wallParts.push(tgeo(boxG, 0, platY+colH/2, -d/2+0.12, 0,0,0, w-0.6, colH, 0.3));
  wallParts.push(tgeo(boxG, -w/2+0.15, platY+colH/2, 0, 0,0,0, 0.3, colH, d-0.6));
  wallParts.push(tgeo(boxG,  w/2-0.15, platY+colH/2, 0, 0,0,0, 0.3, colH, d-0.6));
  var walls=new THREE.Mesh(mergeGeoms(wallParts), MAT.redWall);
  walls.castShadow=walls.receiveShadow=true; g.add(walls);
  /* 前檐窗棂(明间开门,次间窗) */
  var latParts=[];
  for(i=0;i<bays;i++){
    if(i===Math.floor(bays/2)) continue;
    var x2=-w/2+bayW*(i+0.5);
    latParts.push(tgeo(new THREE.PlaneGeometry(bayW-1.1, colH-1.1), x2, platY+colH/2+0.1, d/2+0.02));
  }
  latParts.push(tgeo(new THREE.PlaneGeometry(1.7, colH-0.9), -w/2+bayW*Math.floor(bays/2)+bayW/2, platY+colH/2+0.1, d/2+0.02));
  var lat=new THREE.Mesh(mergeGeoms(latParts), MAT.lattice);
  g.add(lat);
  /* 屋顶 */
  var roofTex=opts.roofTex||MAT.tileGray;
  var roofH=opts.roofH||3.2;
  var roof=new THREE.Mesh(hipRoofGeo(w+2.4, d+2.2, roofH, opts.ridge!==undefined?opts.ridge:0.52, roofH*0.3), roofTex);
  roof.position.y=bandY+0.42; roof.castShadow=true; g.add(roof);
  /* 正脊+鸱吻(金,尺度随屋高) */
  var ridgeY=bandY+0.42+roofH;
  var ridgeLen=(w+2.4)*(opts.ridge!==undefined?opts.ridge:0.52);
  var cf=clamp(roofH*0.15, 0.26, 0.46);
  var ridgeParts=[
    tgeo(boxG, 0, ridgeY+0.1, 0, 0,0,0, ridgeLen+1.1, 0.34*cf/0.4, 0.5),
    tgeo(sphG, -ridgeLen/2-0.45*cf/0.4, ridgeY+0.3*cf/0.4, 0, 0,0,0, cf*1.1, cf*1.7, cf),
    tgeo(sphG,  ridgeLen/2+0.45*cf/0.4, ridgeY+0.3*cf/0.4, 0, 0,0,0, cf*1.1, cf*1.7, cf)
  ];
  var ridge=new THREE.Mesh(mergeGeoms(ridgeParts), opts.gold?MAT.gold:MAT.goldDark);
  ridge.castShadow=true; g.add(ridge);
  /* 地面 */
  var floor=new THREE.Mesh(tgeo(boxG, 0, platY+0.04, 0, 0,0,0, w, 0.1, d), MAT.plank);
  floor.receiveShadow=true; g.add(floor);
  return g;
}

/* 二层楼阁(方壶中央):底大上小,腰檐+上层+顶 */
function buildTowerHall(opts){
  var g=new THREE.Group();
  var w1=opts.w1, d1=opts.d1, w2=opts.w2, d2=opts.d2;
  var colH1=opts.colH1||4.4, colH2=opts.colH2||3.8;

  function story(w, d, colH, y){

    var bw=w/bays;
    var colGeo=new THREE.CylinderGeometry(0.23,0.27,colH,9);
    for(var i=0;i<bays;i++){
      var x=-w/2+bw*(i+0.5);
      parts.cols.push(tgeo(colGeo, x, y+colH/2, d/2-0.45));
      parts.cols.push(tgeo(colGeo, x, y+colH/2, -d/2+0.45));
    }
    parts.cols.push(tgeo(colGeo, -w/2+0.45, y+colH/2, 0));
    parts.cols.push(tgeo(colGeo,  w/2-0.45, y+colH/2, 0));
    parts.band=[
      tgeo(boxG, 0, y+colH+0.14, d/2+0.26, 0,0,0, w+1.4, 0.46, 0.46),
      tgeo(boxG, 0, y+colH+0.14, -d/2-0.26, 0,0,0, w+1.4, 0.46, 0.46),
      tgeo(boxG, w/2+0.26, y+colH+0.14, 0, 0,0,0, 0.46, 0.46, d+0.5),
      tgeo(boxG, -w/2-0.26, y+colH+0.14, 0, 0,0,0, 0.46, 0.46, d+0.5)
    ];
    for(i=0;i<bays;i++){
      if(i===Math.floor(bays/2)) continue;
      parts.lat.push(tgeo(new THREE.PlaneGeometry(bw-1.0, colH-1.0), -w/2+bw*(i+0.5), y+colH/2+0.1, d/2+0.01));
    }
    parts.wall=tgeo(boxG, 0, y+colH/2, -d/2+0.1, 0,0,0, w-0.6, colH, 0.28);
    return parts;
  }
  /* 一层 */
  var s1=story(w1,d1,colH1,baseY);
  g.add(new THREE.Mesh(mergeGeoms(s1.cols), MAT.column));
  var b1=new THREE.Mesh(mergeGeoms(s1.band), MAT.dougong); g.add(b1);
  g.add(new THREE.Mesh(mergeGeoms(s1.lat), MAT.lattice));
  var wl1=new THREE.Mesh(mergeGeoms([s1.wall, tgeo(boxG, -w1/2+0.13, baseY+colH1/2, 0, 0,0,0, 0.26, colH1, d1-0.5), tgeo(boxG,  w1/2-0.13, baseY+colH1/2, 0, 0,0,0, 0.26, colH1, d1-0.5)]), MAT.redWall); g.add(wl1);
  var floor1=new THREE.Mesh(tgeo(boxG, 0, baseY+0.05, 0, 0,0,0, w1, 0.12, d1), MAT.plank); floor1.receiveShadow=true; g.add(floor1);
  /* 腰檐 */
  var roof1=new THREE.Mesh(hipRoofGeo(w1+2.6, d1+2.4, opts.midRoofH||2.6, 0.62, 0.75), roofTex);
  roof1.position.y=baseY+colH1+0.4; roof1.castShadow=true; g.add(roof1);
  /* 二层:自腰檐内升起 */
  var y2=baseY+colH1+(opts.midRoofH||2.6)*0.8;
  var floor2=new THREE.Mesh(tgeo(boxG, 0, y2+0.06, 0, 0,0,0, w2+1.6, 0.14, d2+1.6), MAT.plank); g.add(floor2);
  var s2=story(w2,d2,colH2, y2+0.12);
  g.add(new THREE.Mesh(mergeGeoms(s2.cols), MAT.column));
  g.add(new THREE.Mesh(mergeGeoms(s2.band), MAT.dougong));
  g.add(new THREE.Mesh(mergeGeoms(s2.lat), MAT.lattice));
  var wl2=new THREE.Mesh(mergeGeoms([s2.wall, tgeo(boxG, -w2/2+0.13, y2+0.12+colH2/2, 0, 0,0,0, 0.26, colH2, d2-0.5), tgeo(boxG,  w2/2-0.13, y2+0.12+colH2/2, 0, 0,0,0, 0.26, colH2, d2-0.5)]), MAT.redWall); g.add(wl2);
  /* 顶 */
  var roof2=new THREE.Mesh(hipRoofGeo(w2+2.4, d2+2.2, opts.topRoofH||3.4, 0.5, 1.0), roofTex);
  roof2.position.y=y2+0.12+colH2+0.4; roof2.castShadow=true; g.add(roof2);
  var ridgeY=y2+0.12+colH2+0.4+(opts.topRoofH||3.4);

  var ridge=new THREE.Mesh(mergeGeoms([

  ridge.castShadow=true; g.add(ridge);

}

/* 攒尖亭:n 边,含宝顶 */
function buildPavilion(r, h, n, roofMat, baseY){
  var g=new THREE.Group();
  baseY=baseY||0;
  var colH=h*0.62;
  var colGeo=new THREE.CylinderGeometry(0.16,0.19,colH,8);
  var colParts=[];
  for(var i=0;i<n;i++){
    var a=i/n*Math.PI*2+Math.PI/n;
    colParts.push(tgeo(colGeo, Math.cos(a)*(r-0.5), baseY+colH/2, Math.sin(a)*(r-0.5)));
  }
  var cols=new THREE.Mesh(mergeGeoms(colParts), MAT.column); cols.castShadow=true; g.add(cols);
  var band=new THREE.Mesh(mergeGeoms([
    tgeo(cylG, 0, baseY+colH+0.12, 0, 0,0,0, r+0.1, 0.4, r+0.1)
  ]), MAT.dougong);
  band.scale.z=1; g.add(band);
  var base=new THREE.Mesh(tgeo(cylG, 0, baseY+0.3, 0, 0,0,0, r+1.6, 0.6, r+1.6), MAT.marble);
  base.castShadow=base.receiveShadow=true; g.add(base);
  var railN=n>=6?6:4;
  for(i=0;i<railN;i++){
    var a=i/railN*Math.PI*2+railN/2;
    var seg=new THREE.Mesh(balustradeGeo((r+1.2)*0.95), MAT.marble);
    seg.position.set(Math.cos(a)*(r+0.9), baseY+0.6, Math.sin(a)*(r+0.9));
    seg.rotation.y=-a+Math.PI/2;
    seg.castShadow=true; g.add(seg);
  }
  var roof=new THREE.Mesh(pyramidRoofGeo(r+1.3, h*0.62, n, h*0.22), roofMat);
  roof.position.y=baseY+colH+0.3; roof.castShadow=true; g.add(roof);
  var finial=new THREE.Mesh(mergeGeoms([
    tgeo(sphG, 0, baseY+colH+0.3+h*0.62+0.28, 0, 0,0,0, 0.3,0.38,0.3),
    tgeo(cylG, 0, baseY+colH+0.3+h*0.62-0.05, 0, 0,0,0, 0.34, 0.5, 0.34)
  ]), MAT.gold);
  finial.castShadow=true; g.add(finial);
  return g;
}

/* 多层塔楼(方壶左右亭座/佛楼) */
function buildPagoda(w, stories, roofMat, finial){
  var g=new THREE.Group();
  var y=0;
  var floorGeo=mergeGeoms([tgeo(boxG,0,0.2,0,0,0,0, w+1.2,0.4,w+1.2)]);
  var base=new THREE.Mesh(floorGeo, MAT.marble); base.receiveShadow=true; g.add(base);
  y=0.4;
  for(var s=0;s<stories;s++){
    var ww=w*(1-s*0.16), ch=2.9-s*0.22;
    var colGeo=new THREE.CylinderGeometry(0.15,0.18,ch,8);
    var colParts=[];
    var nb=Math.max(2,Math.round(ww/2.4));
    for(var i=0;i<=nb;i++){
      var x=-ww/2+ww*i/nb;
      if(i===0||i===nb||true) colParts.push(tgeo(colGeo, x, y+ch/2, ww/2-0.4));
      colParts.push(tgeo(colGeo, x, y+ch/2, -ww/2+0.4));
    }
    colParts.push(tgeo(colGeo, -ww/2+0.4, y+ch/2, 0));
    colParts.push(tgeo(colGeo,  ww/2-0.4, y+ch/2, 0));
    var cols=new THREE.Mesh(mergeGeoms(colParts), MAT.column); cols.castShadow=true; g.add(cols);
    var band=new THREE.Mesh(mergeGeoms([
      tgeo(boxG, 0, y+ch+0.12, ww/2+0.2, 0,0,0, ww+0.9, 0.4, 0.4),
      tgeo(boxG, 0, y+ch+0.12, -ww/2-0.2, 0,0,0, ww+0.9, 0.4, 0.4),
      tgeo(boxG, ww/2+0.2, y+ch+0.12, 0, 0,0,0, 0.4, 0.4, ww+0.5),
      tgeo(boxG, -ww/2-0.2, y+ch+0.12, 0, 0,0,0, 0.4, 0.4, ww+0.5)
    ]), MAT.dougong); g.add(band);
    var wall=new THREE.Mesh(tgeo(boxG, 0, y+ch/2, -ww/2+0.12, 0,0,0, ww-0.4, ch, 0.24), MAT.redWall); g.add(wall);
    var lat=new THREE.Mesh(tgeo(new THREE.PlaneGeometry(ww-1.2, ch-0.8), 0, y+ch/2+0.05, ww/2+0.01), MAT.lattice); g.add(lat);
    var roof=new THREE.Mesh(hipRoofGeo(ww+1.9, ww+1.9, 1.6-s*0.1, 0.34, 0.55), roofMat);
    roof.position.y=y+ch+0.32; roof.castShadow=true; g.add(roof);
    y=y+ch+0.32+1.6-s*0.1+0.42;
  }
  if(finial){
    var fin=new THREE.Mesh(mergeGeoms([
      tgeo(sphG, 0, y+0.3, 0, 0,0,0, 0.26,0.34,0.26),
      tgeo(cylG, 0, y-0.02, 0, 0,0,0, 0.3, 0.4, 0.3)
    ]), MAT.gold);
    g.add(fin);
  }
  return g;
}

/* 游廊:沿折线点列 [ [x,z],... ],宽廊 + 坡顶 + 柱 */
function buildCorridor(pts, roofMat){
  var g=new THREE.Group();
  var colParts=[], roofParts=[], railParts=[], latParts=[];
  var W=2.2, ch=2.7;
  var colGeo=new THREE.CylinderGeometry(0.13,0.15,ch,8);
  for(var i=0;i<pts.length-1;i++){
    var ax=pts[i][0], az=pts[i][1], bx=pts[i+1][0], bz=pts[i+1][1];
    var dx=bx-ax, dz=bz-az;
    var len=Math.sqrt(dx*dx+dz*dz);
    var ang=Math.atan2(dx, dz);
    var mx=(ax+bx)/2, mz=(az+bz)/2;
    roofParts.push(tgeo(boxG, mx, ch+0.55, mz, 0, ang, 0, W+1.5, 0.9, len+1.2));
    roofParts.push(tgeo(boxG, mx, ch+1.02, mz, 0, ang, 0, 0.24, 0.16, len+1.2));
    colParts.push(tgeo(colGeo, ax+Math.cos(ang)*(W/2-0.2), ch/2, az-Math.sin(ang)*(W/2-0.2)));
    colParts.push(tgeo(colGeo, ax-Math.cos(ang)*(W/2-0.2), ch/2, az+Math.sin(ang)*(W/2-0.2)));
    colParts.push(tgeo(colGeo, bx+Math.cos(ang)*(W/2-0.2), ch/2, bz-Math.sin(ang)*(W/2-0.2)));
    colParts.push(tgeo(colGeo, bx-Math.cos(ang)*(W/2-0.2), ch/2, bz+Math.sin(ang)*(W/2-0.2)));
    railParts.push(tgeo(boxG, mx, 1.0, mz, 0, ang, 0, 0.1, 0.08, len));
    railParts.push(tgeo(boxG, mx, 0.55, mz, 0, ang, 0, 0.1, 0.07, len));
    latParts.push(tgeo(new THREE.PlaneGeometry(len, ch-0.7), mx, ch/2+0.35, mz, 0, ang+Math.PI/2, 0));
  }
  var cols=new THREE.Mesh(mergeGeoms(colParts), MAT.column); cols.castShadow=true; g.add(cols);
  var roofs=new THREE.Mesh(mergeGeoms(roofParts), roofMat); roofs.castShadow=true; g.add(roofs);

/* 直桥:从 (x1,z1) 到 (x2,z2),含朱红/白石栏杆 */
function buildBridge(x1,z1,x2,z2, wDeck, railMat, archH){
  var g=new THREE.Group();
  var dx=x2-x1, dz=z2-z1;
  var len=Math.sqrt(dx*dx+dz*dz);
  var ang=Math.atan2(dx, dz);
  var cx=(x1+x2)/2, cz=(z1+z2)/2;
  var segs=6;
  var deckParts=[], pierParts=[];
  var deckGeo=new THREE.BoxGeometry(wDeck, 0.22, len/segs+0.12);
  for(var i=0;i<segs;i++){
    var t=(i+0.5)/segs;
    var arch=archH? Math.sin(t*Math.PI)*archH : 0;
    var tilt=archH? Math.cos(t*Math.PI)*(-archH*2/len)*0.9 : 0;
    deckParts.push(tgeo(deckGeo, 0, 0.5+arch, -len/2+len*t, tilt, 0, 0));
    if(i%2===0) pierParts.push(tgeo(boxG, 0, -0.1+arch*0.5, -len/2+len*t, 0,0,0, wDeck*0.8, 1.1, 0.8));
  }
  var deck=new THREE.Mesh(mergeGeoms(deckParts), MAT.plank);
  deck.castShadow=deck.receiveShadow=true;
  g.add(deck);
  var piers=new THREE.Mesh(mergeGeoms(pierParts), MAT.stone); piers.castShadow=true; g.add(piers);
  if(railMat){
    for(i=0;i<2;i++){
      var side=(i===0)?1:-1;
      var rail=new THREE.Mesh(balustradeGeo(len-0.4), railMat);
      rail.position.set(side*wDeck/2, 0.62+archH*0.82, 0);
      rail.rotation.y=Math.PI/2;
      rail.castShadow=true;
      g.add(rail);
    }
  }
  g.position.set(cx,0,cz);
  g.rotation.y=ang;
  return g;
}

/* 九曲桥:折线 [ [x,z]... ],合并为 3 mesh */
function buildZigzagBridge(pts, wDeck, railMat, baseY){
  var g=new THREE.Group();
  var deckParts=[], pierParts=[], railParts=[];
  baseY=baseY||0.5;
  for(var i=0;i<pts.length-1;i++){
    var ax=pts[i][0], az=pts[i][1], bx=pts[i+1][0], bz=pts[i+1][1];
    var dx=bx-ax, dz=bz-az, len=Math.sqrt(dx*dx+dz*dz), ang=Math.atan2(dx,dz);
    var mx=(ax+bx)/2, mz=(az+bz)/2;
    deckParts.push(tgeo(boxG, mx, baseY+0.08, mz, 0, ang, 0, wDeck, 0.2, len+wDeck*0.9));
    /* 栏杆沿行进方向,两侧偏移 perpendicular = (dz,-dx)/len */
    var px=dz/len, pz=-dx/len;
    for(var s=-1;s<=1;s+=2){
      var rGeo=tgeo(balustradeGeo(len+wDeck*0.7, 0.78), 0,0,0);
      var m=new THREE.Matrix4().makeTranslation(mx+px*s*(wDeck/2-0.14), baseY+0.18, mz+pz*s*(wDeck/2-0.14))
        .multiply(new THREE.Matrix4().makeRotationY(ang-Math.PI/2));
      rGeo.applyMatrix4(m);
      railParts.push(rGeo);
    }
    pierParts.push(tgeo(boxG, mx, baseY-0.45, mz, 0, ang, 0, 0.7, 1.0, 0.7));
  }
  var deck=new THREE.Mesh(mergeGeoms(deckParts), MAT.plank); deck.castShadow=deck.receiveShadow=true; g.add(deck);
  var rails=new THREE.Mesh(mergeGeoms(railParts), railMat); rails.castShadow=true; g.add(rails);
  var piers=new THREE.Mesh(mergeGeoms(pierParts), MAT.stone); piers.castShadow=true; g.add(piers);
  return g;
}

function wobbleCircleShape(cx,cz,r,seed,amp){
  var R=rnd(seed||5), pts=[], n=22;
  for(var i=0;i<n;i++){
    var a=i/n*Math.PI*2;
    var rr=r*(1+(R()-0.5)*(amp||0.22));
    pts.push([cx+Math.cos(a)*rr, cz+Math.sin(a)*rr]);
  }
  return pts;
}
function wobbleRectShape(cx,cz,rx,rz,seed,amp){
  /* 超椭圆(圆角矩形)带抖动 */
  var R=rnd(seed||9), pts=[], n=28;
  for(var i=0;i<n;i++){
    var a=i/n*Math.PI*2;
    var ca=Math.cos(a), sa=Math.sin(a);
    var wob=1+(R()-0.5)*(amp||0.12);
    var px=rx*Math.sign(ca)*Math.pow(Math.abs(ca),0.66)*wob;
    var pz=rz*Math.sign(sa)*Math.pow(Math.abs(sa),0.66)*wob;
    pts.push([cx+px, cz+pz]);
  }
  return pts;
}
function landFromPoints(pts, topY, depth){
  var shape=new THREE.Shape();
  shape.moveTo(pts[0][0], -pts[0][1]);
  for(var i=1;i<pts.length;i++) shape.lineTo(pts[i][0], -pts[i][1]);
  shape.closePath();
  var geo=new THREE.ExtrudeGeometry(shape,{depth:depth||0.75, bevelEnabled:false, curveSegments:4});
  geo.rotateX(-Math.PI/2);
  /* 画质升级:台地顶面顶点色——大尺度草色深浅变化,近水/岸缘渐趋枯黄 */
  (function(){
    var pos=geo.attributes.position, n=pos.count;
    var cols=new Float32Array(n*3);
    function edgeDist(x,z){
      var m=1e9;
      for(var k=0;k<pts.length;k++){
        var a=pts[k], b=pts[(k+1)%pts.length];
        var ax=a[0], az=a[1], bx=b[0], bz=b[1];
        var dx=bx-ax, dz=bz-az, L2=dx*dx+dz*dz;
        var t=L2>0? clamp(((x-ax)*dx+(z-az)*dz)/L2,0,1):0;
        var px=ax+dx*t-x, pz=az+dz*t-z;
        var d=Math.sqrt(px*px+pz*pz);
        if(d<m) m=d;
      }
      return m;
    }
    for(var i=0;i<n;i++){
      var x=pos.getX(i), z=pos.getZ(i);
      var n1=Math.sin(x*0.021+1.7)*Math.cos(z*0.017-0.6);
      var n2=Math.sin(x*0.047-z*0.033+4.1)*0.5;
      var dry=clamp(1.0-edgeDist(x,z)/8.5, 0, 1);
      var t=clamp(0.5+n1*0.6+n2*0.4, 0, 1);
      var cr=lerp(0.74,1.0,t), cg=lerp(0.84,1.0,t), cb=lerp(0.58,0.95,t);
      if(dry>0){ cr=lerp(cr,1.0,dry*0.5); cg=lerp(cg,0.86,dry*0.5); cb=lerp(cb,0.42,dry*0.5); }
      cols[i*3]=cr; cols[i*3+1]=cg; cols[i*3+2]=cb;
    }

  })();

  mesh.position.y=topY-(depth||0.75);
  mesh.receiveShadow=true;
  mesh.castShadow=false;
  return mesh;
}

var treeMeshes=[];

function makeTreeInstanced(crownGeo, trunkGeo, matCrown, positions, colorFn, scaleMin, scaleMax, seed){
  var R=rnd(seed||1);
  var n=positions.length;
  var crown=new THREE.InstancedMesh(crownGeo, matCrown, n);
  var trunk=new THREE.InstancedMesh(trunkGeo, MAT.trunk, n);
  var m=new THREE.Matrix4(), q=new THREE.Quaternion(), e=new THREE.Euler(), s=new THREE.Vector3(), p=new THREE.Vector3(), c=new THREE.Color();
  var items=[];
  for(var i=0;i<n;i++){
    var sc=lerp(scaleMin,scaleMax,R());
    var ry=R()*Math.PI*2;
    var pos=positions[i];
    e.set(0,ry,0); q.setFromEuler(e);
    p.set(pos[0], pos[1], pos[2]); s.set(sc,sc*(0.9+R()*0.25),sc);
    m.compose(p,q,s);
    crown.setMatrixAt(i,m);
    trunk.setMatrixAt(i,m);
    crown.setColorAt(i, c.setHex(colorFn(R)));
    items.push({px:pos[0],py:pos[1],pz:pos[2], ry:ry, sx:sc, sy:s.y, sz:sc, ph:R()*6.283, amp:0.012+R()*0.012});
  }
  crown.instanceMatrix.needsUpdate=true;
  trunk.instanceMatrix.needsUpdate=true;
  if(crown.instanceColor) crown.instanceColor.needsUpdate=true;
  crown.castShadow=true; trunk.castShadow=true;
  crown.receiveShadow=false;
  swayData.push({crown:crown, trunk:trunk, items:items});
  return [crown,trunk];
}
/* 画质升级:树冠风摆——逐株随机相位的正弦呼吸(整组实例矩阵微转,不掉帧) */
function updateTreeSway(t){
  var m=new THREE.Matrix4(), q=new THREE.Quaternion(), e=new THREE.Euler(), s=new THREE.Vector3(), p=new THREE.Vector3();
  for(var g=0; g<swayData.length; g++){
    var sd=swayData[g], items=sd.items;
    for(var i=0;i<items.length;i++){
      var it=items[i];
      var tx=Math.sin(t*0.9+it.ph)*it.amp, tz=Math.cos(t*0.68+it.ph*1.3)*it.amp;
      e.set(tx, it.ry, tz); q.setFromEuler(e);
      s.set(it.sx,it.sy,it.sz);
      p.set(it.px,it.py,it.pz);
      m.compose(p,q,s);
      sd.crown.setMatrixAt(i,m);
      sd.trunk.setMatrixAt(i,m);
    }
    sd.crown.instanceMatrix.needsUpdate=true;
    sd.trunk.instanceMatrix.needsUpdate=true;
  }
}

/* ==================== 景区四:九州清晏 ==================== */
function buildJiuzhou(){

      }
      case 'pagoda':{
        var pg=buildPagoda(5.5,3,MAT.glazeGreen,true);
        pg.position.set(cx,0.78,cz);
        g.add(pg);
        break;
      }
      case 'pav4':{
        var p2=buildPavilion(2.9,3.1,4,MAT.tileGray,0.78);
        p2.position.set(cx,0,cz);
        g.add(p2);
        break;

      case 'court':{

        g.add(h2);
        var wl=new THREE.Mesh(mergeGeoms([
          tgeo(boxG, cx+8,2.0,cz, 0,0,0, 0.6,2.4,12),
          tgeo(boxG, cx-8,2.0,cz, 0,0,0, 0.6,2.4,12)
        ]), MAT.redWall);
        g.add(wl);
        break;

      case 'veranda':{

  var avoid=[

    /* 忌落水:检查是否在湖面(粗略) */

  var m=new THREE.Matrix4(), q=new THREE.Quaternion(), e=new THREE.Euler(), s=new THREE.Vector3(), p=new THREE.Vector3(), c=new THREE.Color();

  for(i=0;i<patches.length;i++){

  /* 芦苇(岸线簇) */
  var reedPos=[];

    im.count=placed;
    im.instanceMatrix.needsUpdate=true;
    if(im.instanceColor) im.instanceColor.needsUpdate=true;
    im.castShadow=false;
    world.add(im);
  })();
  /* 落花瓣 300 片(撒在开花树冠下与岸畔) */
  (function(){
    var quad=new THREE.PlaneGeometry(0.17,0.13);
    quad.rotateX(-Math.PI/2);
    var N=IS_MOBILE?150:300;
    var im=new THREE.InstancedMesh(quad, MAT.petalGround, N);
    var placed=0, tries=0;
    var centers=blossomPos.length? blossomPos : [[146,-28]];
    while(placed<N && tries<N*8){
      tries++;
      var bc=centers[placed%centers.length];
      var x=bc[0]+(R()-0.5)*10, z=bc[2]+(R()-0.5)*10;
      if(blocked(x,z)) continue;
      eC.set(0, R()*6.283, (R()-0.5)*0.3); qC.setFromEuler(eC);
      var sc=0.7+R()*0.7;
      sC.set(sc,1,sc);
      pC.set(x, 0.8+R()*0.03, z);
      mC.compose(pC,qC,sC);
      im.setMatrixAt(placed,mC);
      cC.setHSL(0.93+R()*0.03, 0.45, 0.78+R()*0.12);
      im.setColorAt(placed,cC);
      placed++;
    }
    im.count=placed;
    im.instanceMatrix.needsUpdate=true;
    if(im.instanceColor) im.instanceColor.needsUpdate=true;
    world.add(im);
  })();
  /* 花瓣飘落粒子(柔边 sprite) */
  buildFallingPetals();
}

/* ==================== 画质升级:花瓣飘落粒子(柔边 sprite,随风摆动) ==================== */
var petalData=null;
function buildFallingPetals(){
  var N=IS_MOBILE?160:340;
  var pos=new Float32Array(N*3), vel=[];
  var R2=rnd(77);
  var zones=[[146,-28,26,16],[-172,90,50,26],[0,20,80,80],[188,-66,26,18]];
  for(var i=0;i<N;i++){
    var Z=zones[i%zones.length];
    pos[i*3]=Z[0]+(R2()-0.5)*2*Z[2];
    pos[i*3+1]=1.5+R2()*9;
    pos[i*3+2]=Z[1]+(R2()-0.5)*2*Z[3];
    vel.push({vy:0.3+R2()*0.28, swx:0.4+R2()*0.5, ph:R2()*6.28, swz:0.3+R2()*0.4});
  }
  var geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  var mat=new THREE.PointsMaterial({map:TEX.petal, size:0.5, transparent:true, opacity:0.85, depthWrite:false, sizeAttenuation:true});
  var pts=new THREE.Points(geo,mat);
  pts.frustumCulled=false;
  pts.renderOrder=3;
  world.add(pts);
  petalData={pts:pts, vel:vel, N:N};
}
function updateFallingPetals(dt, t){
  if(!petalData) return;
  var arr=petalData.pts.geometry.attributes.position.array;
  for(var i=0;i<petalData.N;i++){
    var v=petalData.vel[i];
    var y=arr[i*3+1]-v.vy*dt;
    if(y<0.8){ y=9+Math.random()*3; arr[i*3]=arr[i*3]+(Math.random()-0.5)*2; }
    arr[i*3]+=Math.sin(t*v.swx+v.ph)*dt*0.6;
    arr[i*3+1]=y;
    arr[i*3+2]+=Math.cos(t*v.swz+v.ph)*dt*0.5;
  }
  petalData.pts.geometry.attributes.position.needsUpdate=true;
}

/* ==================== 画质升级:程序化缓移云(柔边水平云板,不挡交互) ==================== */
var cloudData=[];
function buildClouds(){
  for(var i=0;i<9;i++){
    var tex=(i%2)? TEX.cloud1 : TEX.cloud2;
    var w=150+((i*53)%170), h=w*0.42;
    var m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),
      new THREE.MeshBasicMaterial({map:tex, transparent:true, depthWrite:false, fog:false, opacity:0.8, side:THREE.DoubleSide}));
    m.rotation.x=-Math.PI/2;
    m.position.set(-700+((i*127)%1400), 170+((i*37)%110), -750+((i*211)%1500));
    m.renderOrder=2;
    world.add(m);
    cloudData.push({mesh:m, spd:1.1+((i*7)%10)*0.14});
  }
}
function updateClouds(dt){
  for(var i=0;i<cloudData.length;i++){
    var cd=cloudData[i];
    cd.mesh.position.x+=cd.spd*dt;
    if(cd.mesh.position.x>820) cd.mesh.position.x=-820;
  }
}

/* ==================== 大水法喷泉(粒子水柱) ==================== */
function buildFountain(){
  var N=760;
  var pos=new Float32Array(N*3);
  var geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  var mat=new THREE.PointsMaterial({color:0xd6ecf7, size:0.55, transparent:true, opacity:0.9, blending:THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true});
  var points=new THREE.Points(geo, mat);
  points.frustumCulled=false;
  var emitters=[];
  /* 中央主喷(铜盘之上) */
  emitters.push({x:150, y:2.9, z:105, v0:9.2, spread:0.9, n:220, jitter:0.5});
  /* 环列小喷(8道) */
  for(var i=0;i<8;i++){
    var a=i/8*Math.PI*2;
    emitters.push({x:150+Math.cos(a)*8.8, y:0.9, z:105+Math.sin(a)*8.8, v0:5.2, spread:0.28, n:52, dirx:Math.cos(a)*2.2, dirz:Math.sin(a)*2.2, jitter:0.16});
  }
  fountainData={points:points, emitters:emitters, seeds:[], N:N};
  for(i=0;i<N;i++){
    fountainData.seeds.push({e: i% emitters.length, t: Math.random()*1.3, life:1.3});
  }
  world.add(points);
  /* 中央水柱(半透明) */
  var column=new THREE.Mesh(new THREE.CylinderGeometry(0.7,1.4,4.4,12,1,true), new THREE.MeshBasicMaterial({color:0xdff2fa, transparent:true, opacity:0.24, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide}));
  column.position.set(150,4.6,105);
  fountainData.column=column;
  world.add(column);
}
function updateFountain(dt, tNow){
  if(!fountainData) return;
  var posAttr=fountainData.points.geometry.attributes.position;
  var arr=posAttr.array;
  var g=-15.5;
  for(var i=0;i<fountainData.N;i++){
    var sd=fountainData.seeds[i];
    var em=fountainData.emitters[sd.e];
    sd.t+=dt;
    if(sd.t>sd.life){
      sd.t=0;
      sd.jx=(Math.random()-0.5)*em.jitter;
      sd.jz=(Math.random()-0.5)*em.jitter;
      sd.vx=(em.dirx||0)+(Math.random()-0.5)*em.spread+ (sd.jx||0);
      sd.vz=(em.dirz||0)+(Math.random()-0.5)*em.spread+ (sd.jz||0);
    }
    if(sd.vx===undefined){ sd.vx=(em.dirx||0)+(Math.random()-0.5)*em.spread; sd.vz=(em.dirz||0)+(Math.random()-0.5)*em.spread; }
    var t=sd.t;
    var x=em.x+sd.vx*t;
    var y=em.y+em.v0*t+0.5*g*t*t;
    var z=em.z+sd.vz*t;
    if(y<0.8){ y=0.8; }
    arr[i*3]=x; arr[i*3+1]=y; arr[i*3+2]=z;
  }
  posAttr.needsUpdate=true;
  fountainData.column.scale.set(0.9+Math.sin(tNow*3.1)*0.1, 1+Math.sin(tNow*2.3)*0.08, 0.9+Math.cos(tNow*2.7)*0.1);
}

/* ==================== 景区标签(Sprite) ==================== */
function makeLabel(text, x, y, z){
  var c=document.createElement('canvas');
  c.width=256; c.height=96;
  var g=c.getContext('2d');
  g.font='700 44px "Songti SC","STSong","SimSun",serif';
  g.textAlign='center'; g.textBaseline='middle';
  g.strokeStyle='rgba(20,24,28,0.85)';
  g.lineWidth=7;
  g.strokeText(text,128,42);
  g.fillStyle='#f6efe2';
  g.fillText(text,128,42);
  g.fillStyle='#c9ab72';
  g.fillRect(94,74,68,3);
  var tex=new THREE.CanvasTexture(c);
  tex.encoding=THREE.sRGBEncoding;
  var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false, opacity:0.95}));
  sp.scale.set(17,6.4,1);
  sp.position.set(x,y,z);
  return sp;
}
function buildLabels(){
  world.add(makeLabel('方壶胜境',188,26,-104));
  world.add(makeLabel('正大光明',-168,20,66));
  world.add(makeLabel('大水法',190,19,105));
  world.add(makeLabel('九州清晏',0,20,20));
}
/* 景区点选热区(不可见) */
var hitboxes=[];
function buildHitboxes(){
  var defs=[
    {key:'fangpu', x:188,z:-95, w:70,d:60,h:26},
    {key:'zhengda', x:-168,z:70, w:80,d:110,h:22},

/* ==================== UI 与飞行 ==================== */
function setupUI(){
  var btns=document.querySelectorAll('.nav-btn');
  for(var i=0;i<btns.length;i++){
    btns[i].addEventListener('click', function(){
      flyTo(this.getAttribute('data-scene'));
    });
  }
  document.getElementById('detailClose').addEventListener('click', function(){
    document.getElementById('detail').classList.remove('show');
  });
  /* 3D 热区点选 */
  var ray=new THREE.Raycaster(), mv=new THREE.Vector2(), downXY=null;
  renderer.domElement.addEventListener('mousedown', function(e){ downXY=[e.clientX,e.clientY]; });
  renderer.domElement.addEventListener('mouseup', function(e){
    if(!downXY) return;
    var dx=e.clientX-downXY[0], dy=e.clientY-downXY[1];
    downXY=null;
    if(dx*dx+dy*dy>36) return;
    mv.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
    ray.setFromCamera(mv, camera);
    var hits=ray.intersectObjects(hitboxes, false);
    if(hits.length>0) flyTo(hits[0].object.userData.sceneKey);
  });
  renderer.domElement.addEventListener('touchend', function(e){
    if(e.changedTouches && e.changedTouches.length){
      var t=e.changedTouches[0];
      mv.set(t.clientX/innerWidth*2-1, -(t.clientY/innerHeight)*2+1);
      ray.setFromCamera(mv, camera);
      var hits=ray.intersectObjects(hitboxes, false);
      if(hits.length>0) flyTo(hits[0].object.userData.sceneKey);
    }
  });
}
function markActive(key){
  var btns=document.querySelectorAll('.nav-btn');
  for(var i=0;i<btns.length;i++){
    btns[i].classList.toggle('active', btns[i].getAttribute('data-scene')===key);
  }
}
function updateDetail(key){
  var d=SCENES[key];
  if(!d) return;
  document.getElementById('dName').textContent=d.title;
  document.getElementById('dYear').textContent=d.year;
  document.getElementById('dPoem').textContent=d.poem;
  document.getElementById('dDesc').textContent=d.desc;
  var tags=document.getElementById('dTags');
  tags.innerHTML='';
  for(var i=0;i<d.tags.length;i++){
    var el=document.createElement('div');
    el.className='d-tag';
    el.textContent=d.tags[i];
    tags.appendChild(el);
  }
  document.getElementById('detail').classList.add('show');
}
/* 点击立即起飞(不挂在动画回调链上) */
function flyTo(key){
  var d=SCENES[key];
  if(!d) return;
  currentScene=key;
  markActive(key);
  updateDetail(key);
  animState.flying=true;
  animState.t0=Date.now();
  animState.dur= key==='overview'? 3000 : 2500;
  animState.fromP=camera.position.clone();
  animState.fromL=controls.target.clone();
  animState.toP=new THREE.Vector3(d.cam[0],d.cam[1],d.cam[2]);
  animState.toL=new THREE.Vector3(d.look[0],d.look[1],d.look[2]);
  fineArea=currentScene;
  refreshFineBtn();
}

/* ==================== 精细复原模式:Blender 高模(方壶胜境/大水法;考据:四十景图咏+西洋楼铜版画+清宫档案) ==================== */
var FINE_DEF={
  fangpu:{file:'models/fangpu_high.glb',scale:0.5,pos:{x:188,y:0.35-0.5,z:-88-10*0.5},
          fine:{cam:[118,38,-24],look:[188,7,-97]},
          hide:function(){ if(window.fangpuGroup) window.fangpuGroup.visible=false; },
          show:function(){ if(window.fangpuGroup) window.fangpuGroup.visible=true; }},
  dashuifa:{file:'models/dashuifa_high.glb',scale:0.5,pos:{x:150,y:0.25,z:105},
          fine:{cam:[104,16,166],look:[150,7,102]},matEnv:0.3,matMul:0.85,
          hide:function(){ if(window.dashuifaGroup) window.dashuifaGroup.visible=false; },
          show:function(){ if(window.dashuifaGroup) window.dashuifaGroup.visible=true; }}
};
var fineSt={fangpu:{loaded:false,loading:false,active:false},dashuifa:{loaded:false,loading:false,active:false}};
var fineArea=null;
var fineBtn=document.createElement('button');
fineBtn.style.cssText='position:fixed;right:18px;bottom:118px;z-index:60;padding:10px 20px;'
  +'background:rgba(16,24,32,.88);color:#e8c97a;border:1px solid #c8a24a;border-radius:22px;'
  +'font-family:"Songti SC","STSong",serif;font-size:13px;cursor:pointer;display:none;letter-spacing:2px';
document.body.appendChild(fineBtn);
fineBtn.addEventListener('click',function(){
  if(!fineArea||!FINE_DEF[fineArea]||fineSt[fineArea].loading) return;
  var st=fineSt[fineArea];
  if(!st.loaded){ loadFine(fineArea); return; }
  st.active=!st.active;
  applyFine(fineArea);
});
function refreshFineBtn(){
  var supported=fineArea&&FINE_DEF[fineArea];
  fineBtn.style.display=supported?'block':'none';
  if(!supported) return;
  var st=fineSt[fineArea];
  fineBtn.textContent=st.active?'⬅ 返回意向版':(st.loading?'⏳ 精细复原模型加载中…':'🏯 精细复原版 · 点击切换');
}
function applyFine(area){
  var st=fineSt[area],def=FINE_DEF[area];
  if(st.active){ def.hide(); } else { def.show(); }
  if(st.group) st.group.visible=st.active;
  shadowDirty=true;
  if(currentScene===area){
    var d=st.active?def.fine:SCENES[area];
    animState.flying=true; animState.t0=Date.now(); animState.dur=2200;
    animState.fromP=camera.position.clone(); animState.fromL=controls.target.clone();
    animState.toP=new THREE.Vector3(d.cam[0],d.cam[1],d.cam[2]);
    animState.toL=new THREE.Vector3(d.look[0],d.look[1],d.look[2]);
  }
  refreshFineBtn();
}
function loadFine(area){
  var st=fineSt[area],def=FINE_DEF[area];
  if(st.loading||st.loaded) return;
  st.loading=true; refreshFineBtn();
  new THREE.GLTFLoader().load(def.file,function(g){
    var s=def.scale;
    g.scene.scale.setScalar(s);
    g.scene.position.set(def.pos.x,def.pos.y,def.pos.z);
    g.scene.traverse(function(o){
      if(o.isMesh){
        o.frustumCulled=false; o.castShadow=true; o.receiveShadow=true;
        /* 画质对齐:GLB 材质压环境反射、抬粗糙度,防止汉白玉过曝成白幕 */
        var ms=Array.isArray(o.material)?o.material:[o.material];
        ms.forEach(function(mm){
          if(!mm) return;
          if(mm.envMapIntensity!==undefined) mm.envMapIntensity=def.matEnv||0.45;
          if(mm.roughness!==undefined && mm.roughness<0.45) mm.roughness=0.5;
          if(def.matMul&&def.matMul<1&&mm.color) mm.color.multiplyScalar(def.matMul);
        });
      }
    });
    st.group=g.scene;
    world.add(g.scene);
    st.loaded=true; st.loading=false;
    st.active=true;
    applyFine(area);
  },function(ev){
    fineBtn.textContent='⏳ 加载 '+(ev.total?Math.round(ev.loaded/ev.total*100)+'%':'…');
  },function(e){
    st.loading=false; refreshFineBtn();
    fineBtn.textContent='⚠ 精细模型加载失败';
  });
}
/* 深链:?scene=fangpu&fine=1 直达景区/精细模式(便于分享与测试) */
var qs=new URLSearchParams(location.search);
var qsScene=qs.get('scene');
if(qsScene&&SCENES[qsScene]){
  setTimeout(function(){ flyTo(qsScene); },400);
  if(qs.get('fine')==='1'&&FINE_DEF[qsScene]){
    setTimeout(function(){
      fineArea=qsScene;
      var st=fineSt[qsScene];
      if(!st.loaded) loadFine(qsScene);
      else { st.active=true; applyFine(qsScene); }
    },900);
  }
}
/* 调试读数:仅 ?debug=1 时显示 */
if(qs.get('debug')==='1'){
  var dbg=document.createElement('div');
  dbg.style.cssText='position:fixed;left:10px;bottom:6px;color:#9f9;font:11px/1.6 Menlo,monospace;z-index:99;pointer-events:none;white-space:pre;text-shadow:0 1px 2px #000';
  document.body.appendChild(dbg);
  setInterval(function(){
    try{
      dbg.textContent='cam='+camera.position.toArray().map(function(v){return v.toFixed(0)}).join(',')
        +'  scene='+currentScene+'  fineArea='+fineArea
        +'  fp='+(fineSt.fangpu?fineSt.fangpu.active+'/'+fineSt.fangpu.loaded:'-')
        +'  ds='+(fineSt.dashuifa?fineSt.dashuifa.active+'/'+fineSt.dashuifa.loaded:'-')
        +'  fly='+animState.flying;
    }catch(e){ dbg.textContent='dbg:'+e.message; }
  },600);
}

/* ==================== 主循环 ==================== */
var fpsAcc=0, fpsN=0, fpsShown=0, lastT=Date.now();
var shadowDirty=true;
function animate(){
  requestAnimationFrame(animate);
  var now=Date.now();
  var dt=Math.min((now-lastT)/1000, 0.05);
  lastT=now;
  var t=(now-clock0)/1000;

  if(shadowDirty){
    renderer.shadowMap.needsUpdate=true;
    shadowDirty=false;
  }

  if(animState.flying){
    var p=Math.min((now-animState.t0)/animState.dur, 1);
    var ease=p<0.5? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2;
    camera.position.lerpVectors(animState.fromP, animState.toP, ease);
    /* 弧线抬高,避免穿越山体/屋顶 */
    var arcLift=Math.sin(p*Math.PI)*clamp(animState.fromP.distanceTo(animState.toP)*0.07, 3, 26);
    camera.position.y+=arcLift;
    controls.target.lerpVectors(animState.fromL, animState.toL, ease);
    if(p>=1){ animState.flying=false; }
  }
  controls.update();
  if(camera.position.y<1.2) camera.position.y=1.2;

  /* 画质升级:水面时间推进 + 树冠风摆 + 花瓣飘落 + 云缓移 */
  for(var wi=0; wi<waterMats.length; wi++) waterMats[wi].uniforms.time.value=t;
  updateTreeSway(t);
  updateFallingPetals(dt, t);
  updateClouds(dt);
  updateFountain(dt, t);

  composer.render();

  /* FPS */
  fpsAcc+=dt; fpsN++;
  if(fpsAcc>=1){
    fpsShown=Math.round(fpsN/fpsAcc);
    fpsAcc=0; fpsN=0;
    var meta=document.getElementById('renderMeta');
    if(meta && window.__v4stats){
      meta.textContent='渲染档案 '+window.__v4stats.meshes+' mesh · '+Math.round(window.__v4stats.triangles/1000)+'k 面 · '+fpsShown+' fps';
    }
  }
}

/* ==================== 尺寸自适应 ==================== */
window.addEventListener('resize', function(){
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
});

/* ==================== 启动 ==================== */
try{
  init();
  animate();
  setTimeout(function(){
    document.getElementById('loading').classList.add('hide');
  }, 700);
}catch(err){
  var lg=document.getElementById('loading');
  if(lg){ lg.innerHTML='<div style="padding:40px;font-size:14px;color:#7e2c23">场景初始化失败:'+err.message+'</div>'; }
  throw err;
}
